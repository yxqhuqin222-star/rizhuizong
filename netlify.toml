[build]
  command = "python3 scripts/build_netlify_readonly.py"
  publish = "netlify/public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/dashboard-state"
  status = 200

[[redirects]]
  from = "/download/workbook"
  to = "/.netlify/functions/dashboard-workbook"
  status = 200
